# Configuration de la base de données H2 en mémoire pour les tests
#spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=


spring.datasource.url=jdbc:mysql://localhost:3306/paymybuddyTest?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=always


# Configuration de Hibernate pour les tests
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Initialisation de la base de données pour les tests
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
# Active le chargement des fichiers SQL pour la création du schéma
spring.sql.init.schema-locations=classpath:schema.sql

# Activer la console H2 (optionnel)
##spring.h2.console.enabled=true
##spring.h2.console.path=/h2-console

# Afficher les requêtes SQL dans les logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Niveaux de logs pour le débogage
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=DEBUG

#  permet d'ouvrir la session Hibernate pendant toute la requête HTTP,
#ce qui résout les problèmes d'accès aux collections lazydans la vue (lors de la récupération
spring.jpa.open-in-view=true


